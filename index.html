<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ti5 Scan Rebuild</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true"><span>Ti</span><strong>5</strong></div>
        <div>
          <div class="brand-name">Ti5 Scan Rebuild</div>
          <div class="brand-cn">钛虎扫描件参数化重建助手</div>
        </div>
      </div>
      <div class="top-actions">
        <span class="system-state"><i></i> SolidWorks 已连接</span>
        <button class="icon-button" id="settingsButton" aria-label="打开设置">⚙</button>
      </div>
    </header>

    <main class="workspace">
      <section class="control-panel" aria-labelledby="taskTitle">
        <div class="section-heading">
          <span class="step">新建任务</span>
          <h1 id="taskTitle">把扫描件重建为<br />可编辑模型</h1>
          <p>选择 STL，确认重建精度，剩余步骤由 Ti5 在本机完成。</p>
        </div>

        <div class="field-group">
          <label>扫描文件</label>
          <button class="file-drop" id="fileDrop">
            <span class="file-icon">STL</span>
            <span class="file-copy">
              <strong id="fileName">选择或拖入扫描文件</strong>
              <small id="fileMeta">支持二进制与 ASCII STL，建议单文件小于 2 GB</small>
            </span>
            <span class="browse">浏览</span>
          </button>
          <input id="fileInput" type="file" accept=".stl" hidden />
        </div>

        <fieldset class="field-group precision-group">
          <legend>重建精度</legend>
          <div class="precision-options">
            <label class="precision-card">
              <input type="radio" name="precision" value="simple" />
              <span><strong>简单</strong><small>外形与主要接口</small></span>
              <em>约 5–15 分钟</em>
            </label>
            <label class="precision-card active">
              <input type="radio" name="precision" value="medium" checked />
              <span><strong>中等</strong><small>截面、孔槽与可编辑尺寸</small></span>
              <em>约 20–60 分钟</em>
            </label>
            <label class="precision-card">
              <input type="radio" name="precision" value="fine" />
              <span><strong>精细</strong><small>局部特征与偏差迭代</small></span>
              <em>约 1–3 小时</em>
            </label>
          </div>
        </fieldset>

        <div class="setting-row">
          <div>
            <label>模型引擎</label>
            <strong>自动选择</strong>
            <small>OpenAI 兼容接口 · 仅发送测量摘要</small>
          </div>
          <button class="text-button" id="modelButton">配置模型</button>
        </div>

        <button class="primary-action" id="startButton" disabled>
          <span>开始分析与重建</span><b>→</b>
        </button>
        <p class="privacy-note">原始 STL 默认保留在本机，不上传到模型服务。</p>
      </section>

      <section class="visual-panel" aria-label="模型预览与任务状态">
        <div class="visual-toolbar">
          <div><span class="live-dot"></span><strong>扫描视窗</strong></div>
          <span class="view-label">等待输入</span>
        </div>
        <div class="scan-stage" id="scanStage">
          <div class="axis axis-x">X</div>
          <div class="axis axis-y">Y</div>
          <div class="axis axis-z">Z</div>
          <div class="scan-object" aria-hidden="true">
            <div class="ring ring-a"></div>
            <div class="ring ring-b"></div>
            <div class="ring ring-c"></div>
            <div class="scan-sweep"></div>
          </div>
          <div class="empty-state" id="emptyState">
            <span>01</span>
            <strong>添加扫描件开始</strong>
            <p>这里将显示网格、基准面和重建进度。</p>
          </div>
          <div class="model-caption">
            <span>LOCAL WORKSPACE</span>
            <span id="meshStats">0 VERTICES · 0 FACES</span>
          </div>
        </div>
        <div class="status-strip">
          <div><span>01</span><strong>检查网格</strong></div>
          <div><span>02</span><strong>识别结构</strong></div>
          <div><span>03</span><strong>参数重建</strong></div>
          <div><span>04</span><strong>验证输出</strong></div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="settingsDialog">
    <form method="dialog">
      <div class="dialog-head">
        <div><small>MODEL PROVIDER</small><h2>模型服务设置</h2></div>
        <button class="close-button" value="cancel" aria-label="关闭">×</button>
      </div>
      <label class="dialog-field">服务商
        <select><option>OpenAI 兼容接口</option><option>OpenAI</option><option>Anthropic</option><option>DeepSeek</option><option>本地模型</option></select>
      </label>
      <label class="dialog-field">API 地址<input value="https://api.openai.com/v1" /></label>
      <label class="dialog-field">API Key<input type="password" placeholder="输入后将安全保存在 Windows 凭据中" /></label>
      <label class="dialog-field">模型名称<input value="gpt-5" /></label>
      <div class="dialog-actions"><button class="secondary-action" type="button">测试连接</button><button class="save-action" value="default">保存设置</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
